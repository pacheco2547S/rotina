<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0e0c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Rotina do Gabriel</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#0a0e0c; --card:#131916; --card2:#1a221e; --text:#f2f5f3; --muted:#8a948f; --line:rgba(255,255,255,.08);
  --accent:#2ed573; --accent-soft:rgba(46,213,115,.14); --warn:#fbbf24; --warn-soft:rgba(251,191,36,.14);
  --danger:#ff6b6b; --danger-soft:rgba(255,107,107,.14); --grad:linear-gradient(90deg,#10b981,#2ed573 50%,#a3e635);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{background:radial-gradient(120% 50% at 50% 0%,#0f2a1c 0%,var(--bg) 60%) fixed;min-height:100vh}
main{max-width:520px;margin:0 auto;padding:16px 16px calc(110px + env(safe-area-inset-bottom))}
.hdr{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:4px 0 10px}
h1{font-size:1.45rem;margin:0}
h2{font-size:.85rem;margin:24px 0 10px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.sub{color:var(--muted);margin:2px 0 8px;font-size:.92rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.title{font-weight:600;word-wrap:break-word}
.meta{color:var(--muted);font-size:.86rem}
button{font:inherit;cursor:pointer;border:none;border-radius:14px;min-height:44px;padding:0 16px;background:var(--accent-soft);color:var(--accent);font-weight:600}
button.primary{background:var(--accent);color:#04130b}
button.ghost{background:transparent;color:var(--muted)}
button.danger{background:transparent;color:var(--danger)}
button.icon{width:44px;padding:0;font-size:1.15rem}
button.full{width:100%}
button:disabled{opacity:.4}
.gear{width:46px;height:46px;border-radius:14px;background:var(--card);border:1px solid var(--line);color:var(--text);padding:0;font-size:1.2rem;flex:none}
.check{width:52px;height:52px;min-height:52px;border-radius:50%;border:2.5px solid rgba(255,255,255,.18);background:transparent;color:transparent;font-size:1.5rem;padding:0;flex:none}
.check.on{background:var(--accent);border-color:var(--accent);color:#04130b}
.check.part{border-color:var(--accent)}
.task-check{width:34px;height:34px;min-height:34px;border-radius:10px;font-size:1.05rem}
.done .title{text-decoration:line-through;color:var(--muted)}
.bar{height:6px;border-radius:3px;background:var(--card2);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--grad);border-radius:3px}
.dots{display:flex;gap:6px;margin-top:10px}
.dot{flex:1;text-align:center;font-size:.7rem;color:var(--muted)}
.dot b{display:block;width:22px;height:22px;margin:0 auto 3px;border-radius:50%;border:2px solid rgba(255,255,255,.15)}
.dot b.on{background:var(--accent);border-color:var(--accent)}
.dot b.part{border-color:var(--accent);background:var(--accent-soft)}
.dot.today{color:var(--text);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{min-height:38px;padding:0 14px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--muted);font-weight:500}
.chip.sel{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.tag{display:inline-block;font-size:.72rem;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);margin-right:6px;font-weight:600}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.hl{border-color:var(--warn);border-width:2px}
.empty{color:var(--muted);text-align:center;padding:16px 8px}
.timer{font-variant-numeric:tabular-nums;font-weight:700;color:var(--accent)}
.actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.actions button{flex:1}
input,select,textarea{font:inherit;color:var(--text);background:var(--card2);border:1px solid var(--line);border-radius:12px;min-height:48px;padding:0 12px;width:100%;color-scheme:dark;outline:none}
textarea{padding:10px 12px;min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
label{display:block;font-size:.86rem;color:var(--muted);margin:10px 0 4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.inline{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:.95rem;color:var(--text)}
.inline input{width:24px;min-height:24px;height:24px;accent-color:var(--accent)}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));width:min(488px,calc(100% - 24px));background:rgba(20,26,23,.94);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:24px;display:flex;padding:7px;z-index:5}
nav button{flex:1;min-width:0;background:transparent;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;min-height:54px;font-size:.64rem;font-weight:600;padding:4px 0;border-radius:16px}
nav button span{font-size:1.3rem;line-height:1}
nav button.act{color:var(--accent);background:var(--accent-soft)}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;z-index:10;align-items:flex-end;justify-content:center}
.sheet-bg.open{display:flex}
.sheet{background:#111714;border:1px solid var(--line);border-bottom:0;width:100%;max-width:520px;border-radius:24px 24px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
.sheet h3{margin:0 0 6px}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#1f2a24;border:1px solid var(--line);color:var(--text);padding:11px 18px;border-radius:14px;font-size:.9rem;opacity:0;transition:opacity .25s;pointer-events:none;z-index:20;max-width:90%;text-align:center}
.toast.show{opacity:1}
.big{font-size:2.2rem;font-weight:700;text-align:center;margin:10px 0}
.streak{color:var(--warn);font-weight:700;font-size:.86rem}
.seg{display:flex;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:5px;margin:8px 0 14px}
.seg button{flex:1;background:transparent;color:var(--muted);min-height:40px;border-radius:12px}
.seg button.sel{background:var(--accent-soft);color:var(--accent)}
/* desafios */
.ring{flex:none;position:relative;width:64px;height:64px}
.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:1.05rem;line-height:1}
.ring b small{font-size:.62rem;color:var(--muted);font-weight:500;margin-top:2px}
.ch-item{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.ch-item .title{font-weight:500;font-size:.95rem}
.ch-item.done .title{text-decoration:line-through;color:var(--muted)}
.msg{background:var(--accent-soft);color:var(--accent);border-radius:12px;padding:9px 12px;font-size:.88rem;margin-top:10px}
.cal{display:grid;grid-template-columns:repeat(10,1fr);gap:5px;margin-top:10px}
.cal i{aspect-ratio:1;border-radius:7px;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:.62rem;font-style:normal;color:var(--muted)}
.cal i.ok{background:var(--accent);color:#04130b;font-weight:700}
.cal i.pa{background:var(--accent-soft);color:var(--accent)}
.cal i.miss{background:var(--danger-soft);color:var(--danger)}
.cal i.hoje{outline:2px solid var(--text)}
.abar{display:flex;align-items:center;gap:8px;font-size:.82rem;margin-top:7px}
.abar span:first-child{width:118px;flex:none;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.abar .bar{flex:1;margin:0}
.abar span:last-child{width:38px;text-align:right}
.lib .title{font-size:1.02rem}
.lib p{margin:6px 0 0;color:var(--muted);font-size:.88rem}
.pick{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line);font-size:.92rem}
.pick input{width:22px;min-height:22px;height:22px;flex:none;margin-top:1px;accent-color:var(--accent)}
.scale{display:flex;gap:6px}
.scale button{flex:1;min-height:42px;padding:0;background:var(--card2);color:var(--muted)}
.scale button.sel{background:var(--accent);color:#04130b}
.tl{display:grid;grid-template-columns:62px 1fr;gap:6px 10px;font-size:.88rem}
.tl b{color:var(--accent);font-variant-numeric:tabular-nums}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.78rem;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
a{color:var(--accent)}
.chatbox{display:flex;flex-direction:column;gap:8px}
.bub{background:var(--card);border:1px solid var(--line);border-radius:18px 18px 18px 6px;padding:12px 14px;max-width:94%;font-size:.93rem}
.bub.eu{align-self:flex-end;background:var(--accent-soft);color:var(--accent);border-color:rgba(46,213,115,.3);border-radius:18px 18px 6px 18px;font-weight:600}
</style>
</head>
<body>
<main id="app"></main>
<nav id="nav">
  <button data-tab="hoje"><span>☀️</span>Hoje</button>
  <button data-tab="desafios"><span>🏆</span>Desafios</button>
  <button data-tab="coach"><span>🤖</span>Coach</button>
  <button data-tab="habitos"><span>🌱</span>Hábitos</button>
  <button data-tab="tarefas" data-also="agenda"><span>✅</span>Tarefas</button>
  <button data-tab="evolucao"><span>📈</span>Evolução</button>
</nav>
<div class="sheet-bg" id="sheetBg"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="importFile" accept="application/json,.json" style="display:none">
<script>
(function(){
"use strict";
var KEY = "rotina-gabriel-v1";          // mesma chave de sempre: os dados antigos continuam
var CATS = ["Casa","Faculdade","Pessoal","Saúde"];
var DIAS = ["dom","seg","ter","qua","qui","sex","sáb"];
var MESES = ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
var MAX_ATIVOS = 3, META_DIA = 0.8;     // dia cumprido = 80% das tarefas do desafio

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
/* Dia "lógico": quem trabalha 22h–6h, o que faz de madrugada conta pro dia anterior.
   A virada do dia é às S.cfg.virada horas (padrão 6h). ymd(data) só formata uma data. */
function virada(){ return (S && S.cfg && typeof S.cfg.virada === "number") ? S.cfg.virada : 6; }
function ymdRaw(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function ymd(d){ return ymdRaw(d || new Date(Date.now() - virada()*3600e3)); }
function logicalYmd(ms){ return ymdRaw(new Date(ms - virada()*3600e3)); }
function parse(s){ var p = s.split("-"); return new Date(+p[0], +p[1]-1, +p[2]); }
function addDays(s,n){ var d = parse(s); d.setDate(d.getDate()+n); return ymdRaw(d); }
function diffDays(a,b){ return Math.round((parse(b) - parse(a))/864e5); }
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
function fmtDate(s){
  if(!s) return "";
  var t = ymd(), d = parse(s);
  if(s === t) return "Hoje";
  if(s === addDays(t,1)) return "Amanhã";
  if(s === addDays(t,-1)) return "Ontem";
  return DIAS[d.getDay()] + ", " + d.getDate() + "/" + String(d.getMonth()+1).padStart(2,"0") + (d.getFullYear() !== new Date().getFullYear() ? "/"+d.getFullYear() : "");
}
function fmtMin(m){ m = Math.round(m); if(m < 60) return m+" min"; var h = Math.floor(m/60), r = m%60; return h+"h"+(r?String(r).padStart(2,"0"):""); }
function curMonth(){ return ymd().slice(0,7); }
function monthName(m){ var p = m.split("-"); return MESES[+p[1]-1] + " de " + p[0]; }

function defaults(){
  return {
    version:2,
    habits:[
      {id:"med", name:"Meditação", icon:"🧘", goal:20},
      {id:"fac", name:"Faculdade / estudo", icon:"📚", goal:50},
      {id:"tai", name:"Tai Chi Chuan", icon:"☯️", goal:20}
    ],
    logs:{}, tasks:[], events:[], timer:null,
    challenges:[], checkins:{}, wheel:{}, cfg:{virada:6}
  };
}
var S = null;
/* Migração: só ACRESCENTA o que falta. Nunca apaga hábitos, registros, tarefas ou compromissos. */
function migrate(){
  var d = defaults();
  if(!S || typeof S !== "object") S = d;
  ["habits","tasks","events","challenges"].forEach(function(k){ if(!Array.isArray(S[k])) S[k] = d[k]; });
  ["logs","checkins","wheel"].forEach(function(k){ if(!S[k] || typeof S[k] !== "object" || Array.isArray(S[k])) S[k] = {}; });
  if(!S.cfg || typeof S.cfg !== "object") S.cfg = {};
  if(typeof S.cfg.virada !== "number") S.cfg.virada = 6;
  if(S.timer === undefined) S.timer = null;
  S.challenges.forEach(function(c){ if(!c.log || typeof c.log !== "object") c.log = {}; if(!Array.isArray(c.tasks)) c.tasks = []; if(!c.status) c.status = "ativo"; });
  if(!S.version || S.version < 2) S.version = 2;
}
function load(){
  var raw = null;
  try{ raw = localStorage.getItem(KEY); S = raw ? JSON.parse(raw) : defaults(); }
  catch(e){
    // Dado corrompido: guarda uma cópia antes de seguir, pra não perder nada
    try{ if(raw) localStorage.setItem(KEY+"-corrompido-"+Date.now(), raw); }catch(e2){}
    S = defaults();
  }
  migrate();
}
load.fix = migrate;
var storageOk = true;
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); storageOk = true; }catch(e){ storageOk = false; toast("Não consegui salvar no aparelho. Faça um backup!"); } }

// ---------- hábitos (igual antes) ----------
function getLog(date, hid){ return (S.logs[date] && S.logs[date][hid]) || {min:0, done:false}; }
function setLog(date, hid, log){ if(!S.logs[date]) S.logs[date] = {}; S.logs[date][hid] = log; }
function liveMin(hid){
  var m = getLog(ymd(), hid).min || 0;
  if(S.timer && S.timer.hid === hid) m += (Date.now() - S.timer.start)/60000;
  return m;
}
function status(date, h){
  var l = getLog(date, h.id), m = l.min || 0;
  if(date === ymd()) m = liveMin(h.id);
  if(l.done || (h.goal > 0 && m >= h.goal)) return 2;
  return m > 0 ? 1 : 0;
}
function streak(h){
  var d = ymd(), n = 0;
  if(status(d,h) !== 2) d = addDays(d,-1);
  while(status(d,h) === 2 && n < 3650){ n++; d = addDays(d,-1); }
  return n;
}
function toggleDone(hid){
  var t = ymd(), l = getLog(t, hid), h = habit(hid);
  if(status(t,h) === 2){ l.done = false; if(h.goal && l.min >= h.goal) l.min = 0; }
  else { l.done = true; }
  setLog(t, hid, l); save(); render();
}
function habit(id){ for(var i=0;i<S.habits.length;i++) if(S.habits[i].id===id) return S.habits[i]; return null; }
function startTimer(hid){ if(S.timer) stopTimer(true); S.timer = {hid:hid, start:Date.now()}; save(); render(); }
function stopTimer(silent){
  if(!S.timer) return;
  var hid = S.timer.hid, add = (Date.now() - S.timer.start)/60000;
  var dStart = logicalYmd(S.timer.start); // credita no dia em que começou
  var l = getLog(dStart, hid); l.min = Math.round(((l.min||0) + add)*10)/10; setLog(dStart, hid, l);
  S.timer = null; save();
  if(!silent){ toast("+" + fmtMin(Math.max(add,0)) + " registrados"); render(); }
}
function timerText(){
  if(!S.timer) return "";
  var s = Math.floor((Date.now() - S.timer.start)/1000);
  var h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = s%60;
  return (h? h+":" : "") + String(m).padStart(2,"0") + ":" + String(x).padStart(2,"0");
}

// ---------- tarefas (igual antes) ----------
function addTask(t){ S.tasks.push({id:uid(), title:t.title, date:t.date||"", cat:t.cat||"Pessoal", repeat:!!t.repeat, done:false}); save(); }
function completeTask(id){
  var t = S.tasks.filter(function(x){return x.id===id;})[0]; if(!t) return;
  if(t.done){ t.done = false; delete t.doneAt; save(); render(); return; }
  t.done = true; t.doneAt = ymd();
  if(t.repeat){
    var base = t.date || ymd(), next = addDays(base,7);
    while(next <= ymd()) next = addDays(next,7);
    S.tasks.push({id:uid(), title:t.title, date:next, cat:t.cat, repeat:true, done:false});
    t.repeat = false;
    toast("Feito! Próxima: " + fmtDate(next));
  } else toast("Tarefa concluída 👏");
  save(); render();
}
function sortTasks(a,b){ var da = a.date || "9999", db = b.date || "9999"; return da < db ? -1 : da > db ? 1 : a.title.localeCompare(b.title); }
function sortEvents(a,b){ var x = a.date+" "+(a.time||"99"), y = b.date+" "+(b.time||"99"); return x<y?-1:x>y?1:0; }

// ---------- desafios ----------
function chal(id){ return S.challenges.filter(function(c){return c.id===id;})[0]; }
function ativos(){ return S.challenges.filter(function(c){return c.status==="ativo";}); }
function dayN(c, d){ return diffDays(c.start, d || ymd()) + 1; }
function tasksFor(c, n){
  return c.tasks.filter(function(x){
    if(x.on) return x.on.indexOf(n) >= 0;
    return (!x.from || n >= x.from) && (!x.until || n <= x.until);
  });
}
function doneIds(c, d){ return c.log[d] || []; }
function dayScore(c, d){ // {feitas, total}
  var ts = tasksFor(c, dayN(c,d)), ids = doneIds(c,d);
  return {feitas: ts.filter(function(x){return ids.indexOf(x.id)>=0;}).length, total: ts.length};
}
function dayOk(c, d){ var s = dayScore(c,d); return s.total > 0 && s.feitas >= Math.ceil(s.total*META_DIA); }
function chStreak(c){
  var d = ymd(), n = 0;
  if(!dayOk(c,d)) d = addDays(d,-1);
  while(d >= c.start && dayOk(c,d)){ n++; d = addDays(d,-1); }
  return n;
}
function lastDayOf(c){ return addDays(c.start, c.days-1); }
function chStats(c){ // dias cumpridos e % por área, até hoje (ou até o fim)
  var end = c.status==="ativo" ? ymd() : (c.ended || lastDayOf(c)); if(end > lastDayOf(c)) end = lastDayOf(c);
  var area = {}, ok = 0, passados = 0;
  for(var d = c.start; d <= end; d = addDays(d,1)){
    var ts = tasksFor(c, dayN(c,d)), ids = doneIds(c,d);
    ts.forEach(function(x){ var a = area[x.a] || (area[x.a] = {f:0,t:0}); a.t++; if(ids.indexOf(x.id)>=0) a.f++; });
    if(dayOk(c,d)) ok++;
    if(d < ymd() || d === end) passados++;
  }
  return {area:area, ok:ok, passados:passados};
}
function finish(c, st){
  c.status = st; c.ended = st==="concluido" ? lastDayOf(c) : ymd();
  var s = chStats(c); c.result = {ok:s.ok, dias:c.days, pct:Math.round(s.ok/c.days*100)};
}
/* Roda ao abrir e na virada do dia: aplica a regra de recomeço e encerra desafios que terminaram */
var avisos = [];
function evalChallenges(){
  var t = ymd(), mudou = false;
  ativos().forEach(function(c){
    var d = c.evalFrom && c.evalFrom > c.start ? c.evalFrom : c.start;
    while(d < t){
      if(dayN(c,d) > c.days) break;
      if(c.rule === "recomecar" && !dayOk(c,d)){
        c.best = Math.max(c.best||0, dayN(c,d)-1);
        c.restarts = (c.restarts||0) + 1; c.start = t; c.log = {}; c.evalFrom = t; mudou = true;
        avisos.push("🔁 "+c.nome+": um dia ficou incompleto, então o desafio recomeçou hoje. Recomeçar faz parte, bora de novo!");
        return;
      }
      d = addDays(d,1);
    }
    if(c.evalFrom !== t){ c.evalFrom = t; mudou = true; }
    if(dayN(c,t) > c.days){ finish(c,"concluido"); mudou = true; avisos.push("🏆 Você terminou o desafio "+c.nome+"! Veja o resultado em Evolução."); }
  });
  if(mudou) save();
}
function startChallenge(tpl, opts){
  if(ativos().length >= MAX_ATIVOS){ toast("Máximo de "+MAX_ATIVOS+" desafios ao mesmo tempo. Termine ou pause um antes."); return false; }
  var c = {id:uid(), tpl:tpl?tpl.id:null, nome:opts.nome||tpl.nome, ico:opts.ico||(tpl&&tpl.ico)||"🎯", days:opts.days||tpl.dias,
    start:ymd(), rule:opts.rule||"sequencia", status:"ativo", log:{}, restarts:0, desc:tpl?tpl.desc:"",
    tasks:(opts.tasks||tpl.tasks).map(function(x,i){ var o = JSON.parse(JSON.stringify(x)); o.id = "t"+i; return o; })};
  S.challenges.push(c); save(); return c;
}
function toggleChTask(cid, tid){
  var c = chal(cid); if(!c) return; var t = ymd(), was = dayOk(c,t);
  var ids = (c.log[t] = (c.log[t] || []).slice()), i = ids.indexOf(tid);
  if(i >= 0) ids.splice(i,1); else ids.push(tid);
  save();
  if(!was && dayOk(c,t)){
    var n = dayN(c,t), m = marco(c,n);
    toast(m || ("Dia "+n+" cumprido! 🔥 Sequência: "+chStreak(c)));
  }
  render();
}
function marco(c, n){
  var M = {1:"Primeiro dia feito! O mais difícil é começar e você começou. 💚",
    3:"3 dias seguidos! O hábito está pegando.",
    7:"Uma semana completa! Agora começa a ficar mais fácil. 🔥",
    14:"Duas semanas! Isso já é consistência de verdade.",
    21:"21 dias! Seu cérebro já está se acostumando com essa rotina.",
    30:"30 dias! Um mês inteiro de compromisso com você. 🏅",
    40:"40 dias! Você foi até o fim. Isso é disciplina. 🏆"};
  if(n === c.days) return "Último dia cumprido! Desafio "+c.nome+" completo! 🏆";
  if(M[n]) return M[n];
  if(n === Math.ceil(c.days/2)) return "Metade do caminho! Daqui pra frente cada dia é ladeira abaixo. 💪";
  return "";
}
function motivacao(c){
  var n = dayN(c), sk = chStreak(c), t = ymd(), s = dayScore(c,t);
  if(dayOk(c,t)) return marco(c,n) || "Dia "+n+" cumprido! Descansa com a consciência tranquila. ✅";
  if(sk >= 3) return "🔥 "+sk+" dias seguidos. Não deixe a sequência cair hoje!";
  if(n > 1 && !dayOk(c, addDays(t,-1))) return "Ontem não deu? Regra de ouro: nunca falhar dois dias seguidos.";
  if(s.feitas > 0) return "Faltam "+(Math.ceil(s.total*META_DIA)-s.feitas)+" pra cumprir o dia. Você consegue!";
  return "Comece pela tarefa mais fácil. Começar é metade do caminho.";
}

}

function habitCard(h, full){
  var t = ymd(), st = status(t,h), m = liveMin(h.id), pct = st===2 ? 100 : h.goal ? Math.min(100, m/h.goal*100) : 0;
  var running = S.timer && S.timer.hid === h.id, sk = streak(h);
  var html = '<div class="card"><div class="row">' +
    '<button class="check '+(st===2?"on":st===1?"part":"")+'" data-act="toggleHabit" data-id="'+h.id+'" aria-label="Marcar '+esc(h.name)+'">✓</button>' +
    '<div class="grow"><div class="title">'+esc(h.icon||"")+' '+esc(h.name)+'</div>' +
    '<div class="meta">'+fmtMin(m)+(h.goal?' de '+fmtMin(h.goal):'')+(sk?' · <span class="streak">🔥 '+sk+(sk===1?' dia':' dias')+'</span>':'')+'</div>' +
    (h.goal?'<div class="bar"><i style="width:'+pct+'%"></i></div>':'') + '</div>' +
    (full ? '' : (running ? '<button class="primary" data-act="stopTimer" aria-label="Pausar">⏸ <span data-timer style="margin-left:4px">'+timerText()+'</span></button>'
                          : '<button class="icon" data-act="startTimer" data-id="'+h.id+'" aria-label="Iniciar temporizador">▶</button>')) + '</div>';
  if(!full) return html + '</div>';

/* ---------- Evolução: roda da vida, tendências do check-in, histórico ---------- */
function radar(cur, prev){
  var W = 300, cx = 150, cy = 150, R = 105, n = AREA_KEYS.length, svg = '';
  function pt(i, v){ var ang = -Math.PI/2 + i*2*Math.PI/n; return [cx + Math.cos(ang)*R*v/10, cy + Math.sin(ang)*R*v/10]; }
  [2,4,6,8,10].forEach(function(l){ svg += '<polygon points="'+AREA_KEYS.map(function(a,i){return pt(i,l).join(',');}).join(' ')+'" fill="none" stroke="rgba(255,255,255,.08)"/>'; });
  AREA_KEYS.forEach(function(a,i){ var p = pt(i,10), q = pt(i,12.2);
    svg += '<line x1="'+cx+'" y1="'+cy+'" x2="'+p[0]+'" y2="'+p[1]+'" stroke="rgba(255,255,255,.08)"/>'+
      '<text x="'+q[0]+'" y="'+q[1]+'" fill="#8a948f" font-size="11" text-anchor="middle" dominant-baseline="middle">'+AREAS[a].ico+' '+(cur&&cur[a]?cur[a]:'–')+'</text>'; });
  function poly(d, st){ return '<polygon points="'+AREA_KEYS.map(function(a,i){return pt(i, d[a]||0).join(',');}).join(' ')+'" '+st+'/>'; }
  if(prev) svg += poly(prev, 'fill="none" stroke="#8a948f" stroke-dasharray="4 4" stroke-width="1.5"');
  if(cur) svg += poly(cur, 'fill="rgba(46,213,115,.22)" stroke="#2ed573" stroke-width="2"');
  return '<svg viewBox="0 0 '+W+' '+W+'" width="100%" style="max-width:340px;display:block;margin:0 auto">'+svg+'</svg>';
}
function trendChart(n){
  var days = [], t = ymd();
  for(var i=n-1;i>=0;i--) days.push(addDays(t,-i));
  var W = 320, H = 150, L = 22, B = 18, w = (W-L-6)/(n-1);
  var x = function(i){ return L + i*w; }, y5 = function(v){ return 8 + (H-B-8)*(1-(v-1)/4); };
  var svg = '';
  [1,2,3,4,5].forEach(function(v){ svg += '<line x1="'+L+'" x2="'+(W-6)+'" y1="'+y5(v)+'" y2="'+y5(v)+'" stroke="rgba(255,255,255,.06)"/><text x="4" y="'+(y5(v)+4)+'" fill="#8a948f" font-size="10">'+v+'</text>'; });
  // sono como barras (0–10h, mesma altura)
  days.forEach(function(d,i){ var c = S.checkins[d]; if(c && c.sono){ var hgt = (H-B-8)*Math.min(c.sono,10)/10; svg += '<rect x="'+(x(i)-3)+'" y="'+(H-B-hgt)+'" width="6" height="'+hgt+'" rx="2" fill="rgba(139,156,255,.35)"/>'; } });
  [["energia","#fbbf24"],["humor","#2ed573"],["postura","#fb7185"]].forEach(function(k){
    var pts = []; days.forEach(function(d,i){ var c = S.checkins[d]; if(c && c[k[0]]) pts.push(x(i)+','+y5(c[k[0]])); });
    if(pts.length > 1) svg += '<polyline points="'+pts.join(' ')+'" fill="none" stroke="'+k[1]+'" stroke-width="2" stroke-linejoin="round"/>';
    pts.forEach(function(p){ var q = p.split(','); svg += '<circle cx="'+q[0]+'" cy="'+q[1]+'" r="2.5" fill="'+k[1]+'"/>'; });
  });
  [0, Math.floor((n-1)/2), n-1].forEach(function(i){ var d = parse(days[i]); svg += '<text x="'+x(i)+'" y="'+(H-3)+'" fill="#8a948f" font-size="10" text-anchor="middle">'+d.getDate()+'/'+(d.getMonth()+1)+'</text>'; });
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%">'+svg+'</svg>';
}

/* --------- Relatório pro gestor --------- */
function relatorio(){
  var N = 14, L = instancias(N), t = ymd(), r = [];
  r.push("📋 RELATÓRIO DA ROTINA · Gabriel · últimos "+N+" dias (até "+fmtDate(addDays(t,-1)).toLowerCase()+", "+addDays(t,-1).split("-").reverse().join("/")+")");
  var p = taxa(L); r.push("Geral: "+(p==null?"sem dados":p+"% ("+veredito(p)+")")+" · "+L.length+" tarefas previstas");
  var gc = agrupa(L.filter(function(x){return x.cid;}), function(x){return x.cid;});
  r.push("\nDESAFIOS");
  S.challenges.filter(function(c){ return c.status==="ativo" || gc[c.id]; }).forEach(function(c){
    var g = gc[c.id], q = g ? pct(g.f,g.t) : null;
    r.push("• "+c.nome+": dia "+Math.min(dayN(c),c.days)+"/"+c.days+(c.status!=="ativo"?" ("+c.status+")":"")+" · "+(q==null?"sem dados":q+"% "+veredito(q))+" · sequência "+chStreak(c)+" · regra: "+(c.rule==="recomecar"?"recomeça":"só quebra sequência")+(c.restarts?" · recomeços: "+c.restarts:""));
  });
  var ga = agrupa(L, function(x){return x.a;});
  r.push("\nÁREAS"); Object.keys(ga).sort(function(a,b){return ga[b].f/ga[b].t-ga[a].f/ga[a].t;}).forEach(function(a){ var q = pct(ga[a].f,ga[a].t); r.push("• "+AREAS[a].nome+": "+q+"% ("+ga[a].f+"/"+ga[a].t+")"); });
  var gt = agrupa(L, function(x){return x.k;}), tk = Object.keys(gt).sort(function(a,b){return gt[b].f/gt[b].t-gt[a].f/gt[a].t;});
  r.push("\nTAREFAS"); tk.forEach(function(k){ var q = pct(gt[k].f,gt[k].t); r.push("• "+gt[k].items[0].label+": "+q+"% ("+gt[k].f+"/"+gt[k].t+")"); });
  var miss = tk.filter(function(k){return gt[k].t>=3 && gt[k].f/gt[k].t<0.6;}).reverse().slice(0,3);
  r.push("\nMAIS ESQUECIDAS: "+(miss.length ? miss.map(function(k){return gt[k].items[0].label+" ("+pct(gt[k].f,gt[k].t)+"%)";}).join("; ") : "nenhuma abaixo de 60% 👏"));
  var nck = 0; for(var i=1;i<=N;i++) if(S.checkins[addDays(t,-i)]) nck++;
  r.push("\nCHECK-IN ("+nck+"/"+N+" dias): energia "+avg(N,"energia")+" · humor "+avg(N,"humor")+" · sono "+avg(N,"sono")+"h · postura "+avg(N,"postura")+" (1–5)");
  var tend = ["energia","humor","postura"].map(function(k){ var x = tendencia(k); if(!x) return null; var d = x.ult - x.ant; return k+" "+(Math.abs(d)<0.3?"estável":d>0?"subindo ↑":"caindo ↓"); }).filter(Boolean);
  if(tend.length) r.push("Tendência (5 dias x 5 anteriores): "+tend.join(" · "));
  var cs = correlSono(L); if(cs) r.push("Sono <6h: "+cs.baixo+"% de cumprimento x ≥6h: "+cs.alto+"%");
  var ds = padraoSemana(instancias(30)); if(ds) r.push(ds.folga ? "Folga "+ds.pf+"% x trabalho "+ds.pt+"%" : "Melhor dia: "+ds.melhor+" ("+ds.pm+"%) · pior: "+ds.pior+" ("+ds.pp+"%)");
  var notas = []; for(var j=0;j<N;j++){ var d = addDays(t,-j), c = S.checkins[d]; if(c && c.nota) notas.push(d.slice(8)+"/"+d.slice(5,7)+": "+c.nota); }
  if(notas.length) r.push("\nANOTAÇÕES\n"+notas.slice(0,6).map(function(x){return "• "+x;}).join("\n"));
  var sg = sugestoes().filter(function(s){return s.ico!=="📝";}).slice(0,3);
  if(sg.length) r.push("\nO COACH DO APP SUGERE\n"+sg.map(function(s){return "• "+s.titulo;}).join("\n"));
  return r.join("\n");
}

function checkinForm(){
  var t = ymd(), c = S.checkins[t] || {};
  openSheet('<h3>Check-in de '+fmtDate(t).toLowerCase()+'</h3><p class="meta">1 = muito ruim · 5 = ótimo</p>'+
    scaleRow("energia","⚡ Energia",c.energia)+scaleRow("humor","🙂 Humor",c.humor)+
    '<label>😴 Quantas horas dormiu?</label><input type="number" name="sono" min="0" max="16" step="0.5" inputmode="decimal" value="'+(c.sono||"")+'" placeholder="Ex.: 7">'+
    scaleRow("postura","🧍 Postura / dor nas costas (5 = sem dor)",c.postura)+
    '<label>Anotação (opcional)</label><textarea name="nota" placeholder="Como foi o dia? O que ajudou ou atrapalhou?">'+esc(c.nota||"")+'</textarea>'+formBtns,
  function(f){
    var o = {energia:+f.energia.value, humor:+f.humor.value, postura:+f.postura.value, sono:parseFloat(String(f.sono.value).replace(",","."))||0, nota:f.nota.value.trim()};
    if(!o.energia || !o.humor || !o.postura){ toast("Toque numa nota de 1 a 5 em cada item."); return false; }
    S.checkins[t] = o; save(); toast("Check-in salvo ✔"); render();
  });
}
function wheelForm(){
  var m = curMonth(), c = S.wheel[m] || {};
  openSheet('<h3>Roda da vida · '+monthName(m)+'</h3><p class="meta">De 1 a 10, quanto você está satisfeito com cada área hoje? Seja sincero, ninguém mais vê.</p>'+
    AREA_KEYS.map(function(a){ var v = c[a]||5; return '<label>'+AREAS[a].ico+' '+AREAS[a].nome+': <b data-out="'+a+'">'+v+'</b></label><input type="range" name="'+a+'" min="1" max="10" value="'+v+'" style="padding:0;accent-color:#2ed573" oninput="this.previousElementSibling.querySelector(\'b\').textContent=this.value">'; }).join('')+formBtns,
  function(f){ var o = {}; AREA_KEYS.forEach(function(a){ o[a] = +f[a].value; }); S.wheel[m] = o; save();
    var low = AREA_KEYS.slice().sort(function(a,b){return o[a]-o[b];})[0];
    toast("Salvo! Área com mais espaço pra crescer: "+AREAS[low].nome); render(); });
}

// ---------- backup ----------
function doExport(){
  if(S.timer) stopTimer(true);
  var blob = new Blob([JSON.stringify(S,null,2)], {type:"application/json"});
  var a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "rotina-backup-"+ymd()+".json";
  document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  toast("Backup gerado"); render();
}
document.getElementById("importFile").addEventListener("change", function(){
  var file = this.files[0]; if(!file) return; var r = new FileReader();
  r.onload = function(){
    try{ var d = JSON.parse(r.result); if(!d || !Array.isArray(d.habits)) throw 0;
      if(!confirm("Substituir os dados atuais pelos do backup?")) return;
      S = d; migrate(); save(); toast("Backup importado ✔"); render();
    }catch(e){ alert("Arquivo inválido. Escolha um backup exportado por este app."); }
  };
  r.readAsText(file); this.value = "";
});

// ---------- eventos ----------
document.addEventListener("click", function(e){
  var b = e.target.closest("[data-act],[data-tab]"); if(!b) return;
  if(b.dataset.tab){ tab = b.dataset.tab; closeSheet(); render(); window.scrollTo(0,0); return; }
  var id = b.dataset.id;
  switch(b.dataset.act){
    case "toggleHabit": toggleDone(id); break;
    case "startTimer": startTimer(id); break;
    case "stopTimer": stopTimer(); break;
    case "addMin": minForm(id); break;
    case "plus": var l = getLog(ymd(),id); l.min = (l.min||0) + (+b.dataset.n); setLog(ymd(),id,l); save(); closeSheet(); toast("+"+b.dataset.n+" min"); render(); break;
    case "editHabit": habitForm(id); break;
    case "newHabit": habitForm(null); break;
    case "delHabit": if(confirm("Remover este hábito? O histórico dele some.")){ S.habits = S.habits.filter(function(h){return h.id!==id;}); if(S.timer&&S.timer.hid===id) S.timer=null; save(); closeSheet(); render(); } break;
    case "newTask": taskForm(taskFilter!=="Todas"?{cat:taskFilter}:null); break;
    case "quick": taskForm({title:b.dataset.title, cat:"Casa", date:ymd(), repeat:true}); break;
    case "toggleTask": completeTask(id); break;
    case "delTask": if(confirm("Apagar esta tarefa?")){ S.tasks = S.tasks.filter(function(t){return t.id!==id;}); save(); render(); } break;
    case "filter": taskFilter = b.dataset.cat; render(); break;
    case "clearDone": S.tasks = S.tasks.filter(function(t){return !t.done;}); save(); render(); break;
    case "newEvent": eventForm(null); break;
    case "editEvent": eventForm(id); break;
    case "delEvent": if(confirm("Apagar este compromisso?")){ S.events = S.events.filter(function(x){return x.id!==id;}); save(); render(); } break;
    case "export": doExport(); break;
    case "import": document.getElementById("importFile").click(); break;
    case "reset": if(confirm("Tem certeza? Isso apaga tudo. Faça um backup antes.") && confirm("Última confirmação: apagar todos os dados?")){ S = defaults(); save(); render(); } break;
    case "close": closeSheet(); break;
    // desafios
    case "chTask": toggleChTask(b.dataset.c, id); break;
    case "chView": chViewForm(id); break;
    case "chCustom": customForm(); break;
    case "chRule": ruleForm(b.dataset.c); break;
    case "chQuit": var c = chal(b.dataset.c); if(c && confirm("Encerrar o desafio \""+c.nome+"\"? Ele vai pro histórico.")){ finish(c,"encerrado"); save(); toast("Desafio encerrado. Recomeçar faz parte!"); render(); } break;
    case "dur": Array.prototype.forEach.call(document.querySelectorAll("#durs .chip"), function(x){ x.classList.toggle("sel", x===b); }); document.querySelector("#f [name=days]").value = b.dataset.n; break;
    case "addOwn": var f = document.getElementById("f"), tx = f.own.value.trim(); if(!tx){ toast("Escreva a tarefa primeiro."); break; } custom.extra.push({t:tx, a:f.ownA.value, q:""}); f.own.value = ""; drawOwn(); break;
    case "rmOwn": custom.extra.splice(+b.dataset.n,1); drawOwn(); break;
    case "checkin": checkinForm(); break;
    case "scale": var box = b.parentNode; Array.prototype.forEach.call(box.children, function(x){ x.classList.toggle("sel", x===b); }); box.nextElementSibling.value = b.dataset.n; break;
    case "wheel": wheelForm(); break;
    case "trend": trendN = +b.dataset.n; render(); break;
    case "coachN": coachN = +b.dataset.n; render(); break;
    case "ask": var R = RESP[b.dataset.k]; chat.push({eu:true, txt:R[0]}); chat.push({eu:false, txt:R[1]()}); if(chat.length > 12) chat = chat.slice(-12); render(); setTimeout(function(){ var bs = document.querySelectorAll(".bub"); if(bs.length) bs[bs.length-1].scrollIntoView({behavior:"smooth", block:"start"}); }, 30); break;
    case "gestor": mandarGestor(); break;
    case "shareRep": shareRep(); break;
    case "coachLight": if(confirm("Pausar as tarefas mais difíceis deste desafio a partir de hoje?")) coachLight(b.dataset.c); break;
    case "coachUp": coachUp(b.dataset.c, b.dataset.t, b.dataset.a); break;
    case "go": tab = b.dataset.tab2; render(); window.scrollTo(0,0); break;
    case "folga": var fo = S.cfg.folgas = S.cfg.folgas || [], fi = fo.indexOf(+b.dataset.n); if(fi>=0) fo.splice(fi,1); else fo.push(+b.dataset.n); save(); render(); break;
  }
});

// timer ao vivo + virada do dia
var lastDay = null;
setInterval(function(){
  if(S.timer){ var els = document.querySelectorAll("[data-timer]"); for(var i=0;i<els.length;i++) els[i].textContent = timerText(); }
  if(ymd() !== lastDay){ lastDay = ymd(); if(!bg.classList.contains("open")) render(); }
}, 1000);
setInterval(function(){ if(S.timer && !bg.classList.contains("open")) render(); }, 30000);
document.addEventListener("visibilitychange", function(){ if(!document.hidden && !bg.classList.contains("open")) render(); });

load(); save(); lastDay = ymd(); render();
if("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(function(){});
window.__rotina = {relatorio:function(){return relatorio();}, sugestoes:function(){return sugestoes();}, resp:function(k){return RESP[k][1]();}, state:function(){return S;}, ymd:ymd, addDays:addDays, streak:streak, status:status, evalChallenges:evalChallenges, dayOk:dayOk, render:render};
})();
