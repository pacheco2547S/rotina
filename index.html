<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f6f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121614" media="(prefers-color-scheme: dark)">
<title>Minha Rotina</title>
<style>
:root{
  --bg:#f4f6f5; --card:#ffffff; --text:#1d2a24; --muted:#6b7a72; --line:#e2e8e4;
  --accent:#3f8f6b; --accent-soft:#e3f1ea; --warn:#c7772e; --warn-soft:#fbeedd;
  --danger:#c24a4a; --shadow:0 1px 3px rgba(0,0,0,.06);
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#121614; --card:#1c221f; --text:#e6ece8; --muted:#93a29a; --line:#2c3530;
    --accent:#6cc39a; --accent-soft:#1f3a2e; --warn:#e3a35f; --warn-soft:#3a2c1c; --danger:#e57373; --shadow:none; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px 16px calc(96px + env(safe-area-inset-bottom))}
h1{font-size:1.5rem;margin:4px 0 2px}
h2{font-size:1.05rem;margin:22px 0 10px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.sub{color:var(--muted);margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.title{font-weight:600;word-wrap:break-word}
.meta{color:var(--muted);font-size:.88rem}
button{font:inherit;cursor:pointer;border:none;border-radius:12px;min-height:44px;padding:0 16px;background:var(--accent-soft);color:var(--accent);font-weight:600}
button.primary{background:var(--accent);color:#fff}
@media (prefers-color-scheme: dark){button.primary{color:#0f1a14}}
button.ghost{background:transparent;color:var(--muted)}
button.danger{background:transparent;color:var(--danger)}
button.icon{width:44px;padding:0;font-size:1.2rem}
button.full{width:100%}
.check{width:52px;height:52px;min-height:52px;border-radius:50%;border:2.5px solid var(--line);background:transparent;color:transparent;font-size:1.5rem;padding:0;flex:none}
.check.on{background:var(--accent);border-color:var(--accent);color:#fff}
.check.part{border-color:var(--accent)}
.task-check{width:34px;height:34px;min-height:34px;border-radius:10px;font-size:1.1rem}
.done .title{text-decoration:line-through;color:var(--muted)}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.dots{display:flex;gap:6px;margin-top:10px}
.dot{flex:1;text-align:center;font-size:.7rem;color:var(--muted)}
.dot b{display:block;width:22px;height:22px;margin:0 auto 3px;border-radius:50%;border:2px solid var(--line)}
.dot b.on{background:var(--accent);border-color:var(--accent)}
.dot b.part{border-color:var(--accent);background:var(--accent-soft)}
.dot.today{color:var(--text);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{min-height:38px;padding:0 14px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--text);font-weight:500}
.chip.sel{background:var(--accent);border-color:var(--accent);color:#fff}
.tag{display:inline-block;font-size:.75rem;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);margin-right:6px;font-weight:600}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.hl{border-color:var(--warn);border-width:2px}
.empty{color:var(--muted);text-align:center;padding:16px 8px}
.timer{font-variant-numeric:tabular-nums;font-weight:700;color:var(--accent)}
.actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.actions button{flex:1}
input,select{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:12px;min-height:48px;padding:0 12px;width:100%}
label{display:block;font-size:.88rem;color:var(--muted);margin:10px 0 4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.inline{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:.95rem}
.inline input{width:24px;min-height:24px;height:24px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:5}
nav button{flex:1;background:transparent;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;min-height:56px;font-size:.72rem;font-weight:600;padding:4px 0;border-radius:12px}
nav button span{font-size:1.35rem;line-height:1}
nav button.act{color:var(--accent);background:var(--accent-soft)}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;z-index:10;align-items:flex-end;justify-content:center}
.sheet-bg.open{display:flex}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto}
.sheet h3{margin:0 0 6px}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:.9rem;opacity:0;transition:opacity .25s;pointer-events:none;z-index:20}
.toast.show{opacity:1}
.big{font-size:2.2rem;font-weight:700;text-align:center;margin:10px 0}
.streak{color:var(--warn);font-weight:700;font-size:.88rem}
</style>
</head>
<body>
<main id="app"></main>
<nav id="nav">
  <button data-tab="hoje"><span>☀️</span>Hoje</button>
  <button data-tab="habitos"><span>🌱</span>Hábitos</button>
  <button data-tab="tarefas"><span>✅</span>Tarefas</button>
  <button data-tab="agenda"><span>📅</span>Agenda</button>
  <button data-tab="ajustes"><span>⚙️</span>Ajustes</button>
</nav>
<div class="sheet-bg" id="sheetBg"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="importFile" accept="application/json,.json" style="display:none">
<script>
(function(){
"use strict";
var KEY = "rotina-gabriel-v1";
var CATS = ["Casa","Faculdade","Pessoal","Saúde"];
var DIAS = ["dom","seg","ter","qua","qui","sex","sáb"];
var MESES = ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function ymd(d){ d = d || new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function parse(s){ var p = s.split("-"); return new Date(+p[0], +p[1]-1, +p[2]); }
function addDays(s,n){ var d = parse(s); d.setDate(d.getDate()+n); return ymd(d); }
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
function fmtDate(s){
  if(!s) return "";
  var t = ymd(), d = parse(s);
  if(s === t) return "Hoje";
  if(s === addDays(t,1)) return "Amanhã";
  if(s === addDays(t,-1)) return "Ontem";
  return DIAS[d.getDay()] + ", " + d.getDate() + "/" + String(d.getMonth()+1).padStart(2,"0") + (d.getFullYear() !== new Date().getFullYear() ? "/"+d.getFullYear() : "");
}
function fmtMin(m){ m = Math.round(m); if(m < 60) return m+" min"; var h = Math.floor(m/60), r = m%60; return h+"h"+(r?String(r).padStart(2,"0"):""); }

function defaults(){
  return {
    version:1,
    habits:[
      {id:"med", name:"Meditação", icon:"🧘", goal:20},
      {id:"fac", name:"Faculdade / estudo", icon:"📚", goal:50},
      {id:"tai", name:"Tai Chi Chuan", icon:"☯️", goal:20}
    ],
    logs:{}, tasks:[], events:[], timer:null
  };
}
var S;
function load(){
  try{ var raw = localStorage.getItem(KEY); S = raw ? JSON.parse(raw) : defaults(); }catch(e){ S = defaults(); }
  var d = defaults();
  ["habits","tasks","events"].forEach(function(k){ if(!Array.isArray(S[k])) S[k] = d[k]; });
  if(!S.logs || typeof S.logs !== "object") S.logs = {};
}
var storageOk = true;
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); storageOk = true; }catch(e){ storageOk = false; toast("Não consegui salvar no aparelho. Faça um backup!"); } }

// ---------- hábitos ----------
function getLog(date, hid){ return (S.logs[date] && S.logs[date][hid]) || {min:0, done:false}; }
function setLog(date, hid, log){ if(!S.logs[date]) S.logs[date] = {}; S.logs[date][hid] = log; }
function liveMin(hid){ // minutos de hoje incluindo timer rodando
  var m = getLog(ymd(), hid).min || 0;
  if(S.timer && S.timer.hid === hid) m += (Date.now() - S.timer.start)/60000;
  return m;
}
function status(date, h){ // 2 feito, 1 parcial, 0 nada
  var l = getLog(date, h.id), m = l.min || 0;
  if(date === ymd()) m = liveMin(h.id);
  if(l.done || (h.goal > 0 && m >= h.goal)) return 2;
  return m > 0 ? 1 : 0;
}
function streak(h){
  var d = ymd(), n = 0;
  if(status(d,h) !== 2) d = addDays(d,-1);
  while(status(d,h) === 2 && n < 3650){ n++; d = addDays(d,-1); }
  return n;
}
function toggleDone(hid){
  var t = ymd(), l = getLog(t, hid), h = habit(hid);
  if(status(t,h) === 2){ l.done = false; if(h.goal && l.min >= h.goal) l.min = 0; }
  else { l.done = true; }
  setLog(t, hid, l); save(); render();
}
function habit(id){ for(var i=0;i<S.habits.length;i++) if(S.habits[i].id===id) return S.habits[i]; return null; }
function startTimer(hid){
  if(S.timer) stopTimer(true);
  S.timer = {hid:hid, start:Date.now()}; save(); render();
}
function stopTimer(silent){
  if(!S.timer) return;
  var hid = S.timer.hid, add = (Date.now() - S.timer.start)/60000;
  var dStart = ymd(new Date(S.timer.start)); // credita no dia em que começou
  var l = getLog(dStart, hid); l.min = Math.round(((l.min||0) + add)*10)/10; setLog(dStart, hid, l);
  S.timer = null; save();
  if(!silent){ toast("+" + fmtMin(Math.max(add,0)) + " registrados"); render(); }
}
function timerText(){
  if(!S.timer) return "";
  var s = Math.floor((Date.now() - S.timer.start)/1000);
  var h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = s%60;
  return (h? h+":" : "") + String(m).padStart(2,"0") + ":" + String(x).padStart(2,"0");
}

// ---------- tarefas ----------
function addTask(t){ S.tasks.push({id:uid(), title:t.title, date:t.date||"", cat:t.cat||"Pessoal", repeat:!!t.repeat, done:false}); save(); }
function completeTask(id){
  var t = S.tasks.filter(function(x){return x.id===id;})[0]; if(!t) return;
  if(t.done){ t.done = false; delete t.doneAt; save(); render(); return; }
  t.done = true; t.doneAt = ymd();
  if(t.repeat){
    var base = t.date || ymd(), next = addDays(base,7);
    while(next <= ymd()) next = addDays(next,7);
    S.tasks.push({id:uid(), title:t.title, date:next, cat:t.cat, repeat:true, done:false});
    t.repeat = false;
    toast("Feito! Próxima: " + fmtDate(next));
  } else toast("Tarefa concluída 👏");
  save(); render();
}
function sortTasks(a,b){
  var da = a.date || "9999", db = b.date || "9999";
  return da < db ? -1 : da > db ? 1 : a.title.localeCompare(b.title);
}

// ---------- compromissos ----------
function sortEvents(a,b){ var x = a.date+" "+(a.time||"99"), y = b.date+" "+(b.time||"99"); return x<y?-1:x>y?1:0; }

// ---------- UI ----------
var tab = "hoje", taskFilter = "Todas", app = document.getElementById("app");
function toast(msg){ var t = document.getElementById("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toast._t); toast._t = setTimeout(function(){t.classList.remove("show");}, 2200); }

function habitCard(h, full){
  var t = ymd(), st = status(t,h), m = liveMin(h.id), pct = st===2 ? 100 : h.goal ? Math.min(100, m/h.goal*100) : 0;
  var running = S.timer && S.timer.hid === h.id, sk = streak(h);
  var html = '<div class="card"><div class="row">' +
    '<button class="check '+(st===2?"on":st===1?"part":"")+'" data-act="toggleHabit" data-id="'+h.id+'" aria-label="Marcar '+esc(h.name)+'">✓</button>' +
    '<div class="grow"><div class="title">'+esc(h.icon||"")+' '+esc(h.name)+'</div>' +
    '<div class="meta">'+fmtMin(m)+(h.goal?' de '+fmtMin(h.goal):'')+(sk?' · <span class="streak">🔥 '+sk+(sk===1?' dia':' dias')+'</span>':'')+'</div>' +
    (h.goal?'<div class="bar"><i style="width:'+pct+'%"></i></div>':'') + '</div>' +
    (full ? '' : (running ? '<button class="primary" data-act="stopTimer" aria-label="Pausar">⏸ <span data-timer style="margin-left:4px">'+timerText()+'</span></button>'
                          : '<button class="icon" data-act="startTimer" data-id="'+h.id+'" aria-label="Iniciar temporizador">▶</button>')) + '</div>';
  if(!full) return html + '</div>';
  if(full){
    html += '<div class="dots">';
    for(var i=6;i>=0;i--){ var d = addDays(t,-i), s = status(d,h);
      html += '<div class="dot'+(i===0?' today':'')+'"><b class="'+(s===2?'on':s===1?'part':'')+'"></b>'+DIAS[parse(d).getDay()]+'</div>'; }
    html += '</div>';
  }
  html += '<div class="actions">' +
    (running ? '<button class="primary" data-act="stopTimer">⏸ Pausar <span class="timer" data-timer style="color:inherit">'+timerText()+'</span></button>'
             : '<button data-act="startTimer" data-id="'+h.id+'">▶ Iniciar</button>') +
    '<button data-act="addMin" data-id="'+h.id+'">+ minutos</button>' +
    (full?'<button class="ghost icon" data-act="editHabit" data-id="'+h.id+'" aria-label="Editar">✎</button>':'') +
    '</div></div>';
  return html;
}
function taskCard(t){
  var late = t.date && !t.done && t.date < ymd();
  return '<div class="card'+(t.done?' done':'')+'"><div class="row">' +
    '<button class="check task-check '+(t.done?'on':'')+'" data-act="toggleTask" data-id="'+t.id+'" aria-label="Concluir">✓</button>' +
    '<div class="grow"><div class="title">'+esc(t.title)+'</div><div class="meta"><span class="tag">'+esc(t.cat)+'</span>' +
    (t.date?'<span class="'+(late?'tag warn':'')+'">'+(late?'Atrasada · ':'')+fmtDate(t.date)+'</span>':'') +
    (t.repeat?' · 🔁 semanal':'')+'</div></div>' +
    '<button class="danger icon" data-act="delTask" data-id="'+t.id+'" aria-label="Apagar">🗑</button></div></div>';
}
function eventCard(e){
  var t = ymd(), hl = e.date === t || e.date === addDays(t,1), past = e.date < t;
  return '<div class="card'+(hl?' hl':'')+'" style="'+(past?'opacity:.55':'')+'"><div class="row"><div class="grow">' +
    '<div class="title">'+esc(e.title)+'</div><div class="meta">' +
    (hl?'<span class="tag warn">'+fmtDate(e.date)+'</span>':fmtDate(e.date)+' · ') + (e.time?esc(e.time):'sem horário') +
    (e.place?' · 📍 '+esc(e.place):'')+'</div></div>' +
    '<button class="ghost icon" data-act="editEvent" data-id="'+e.id+'" aria-label="Editar">✎</button>' +
    '<button class="danger icon" data-act="delEvent" data-id="'+e.id+'" aria-label="Apagar">🗑</button></div></div>';
}

function viewHoje(){
  var t = ymd(), d = new Date();
  var feitos = S.habits.filter(function(h){return status(t,h)===2;}).length;
  var h = '<h1>'+ (d.getHours()<12?'Bom dia':d.getHours()<18?'Boa tarde':'Boa noite') +', Gabriel</h1>' +
    '<p class="sub">'+["Domingo","Segunda","Terça","Quarta","Quinta","Sexta","Sábado"][d.getDay()]+', '+d.getDate()+' de '+MESES[d.getMonth()]+' de '+d.getFullYear()+'</p>';
  h += '<h2>Hábitos · '+feitos+'/'+S.habits.length+'</h2>';
  h += S.habits.length ? S.habits.map(function(x){return habitCard(x,false);}).join('') : '<div class="empty">Nenhum hábito. Adicione na aba Hábitos.</div>';
  var pend = S.tasks.filter(function(x){return !x.done && (!x.date || x.date <= t);}).sort(sortTasks);
  h += '<h2>Tarefas de hoje</h2>' + (pend.length ? pend.map(taskCard).join('') : '<div class="empty">Nada pendente pra hoje 🎉</div>');
  h += '<button class="full" data-act="newTask">+ Nova tarefa</button>';
  var evHoje = S.events.filter(function(e){return e.date===t;}).sort(sortEvents);
  var prox = S.events.filter(function(e){return e.date>t;}).sort(sortEvents).slice(0,3);
  h += '<h2>Compromissos de hoje</h2>' + (evHoje.length ? evHoje.map(eventCard).join('') : '<div class="empty">Nenhum compromisso hoje.</div>');
  if(prox.length) h += '<h2>Próximos</h2>' + prox.map(eventCard).join('');
  return h;
}
function viewHabitos(){
  return '<h1>Hábitos</h1><p class="sub">Toque no círculo para marcar como feito, ou use o temporizador para somar minutos.</p>' +
    S.habits.map(function(x){return habitCard(x,true);}).join('') +
    '<button class="full primary" data-act="newHabit">+ Novo hábito</button>';
}
function viewTarefas(){
  var list = S.tasks.filter(function(x){return taskFilter==="Todas" || x.cat===taskFilter;});
  var open = list.filter(function(x){return !x.done;}).sort(sortTasks), done = list.filter(function(x){return x.done;});
  var h = '<h1>Tarefas</h1><div class="actions" style="margin:10px 0 14px">' +
    '<button data-act="quick" data-title="Lavar roupa">🧺 Lavar roupa</button><button data-act="quick" data-title="Limpar a casa">🧹 Limpar a casa</button></div>' +
    '<button class="full primary" data-act="newTask">+ Nova tarefa</button><div class="chips" style="margin-top:14px">' +
    ["Todas"].concat(CATS).map(function(c){return '<button class="chip'+(c===taskFilter?' sel':'')+'" data-act="filter" data-cat="'+c+'">'+c+'</button>';}).join('') + '</div>';
  h += open.length ? open.map(taskCard).join('') : '<div class="empty">Nenhuma tarefa pendente.</div>';
  if(done.length) h += '<h2>Concluídas ('+done.length+')</h2>' + done.slice(-15).reverse().map(taskCard).join('') +
    '<button class="ghost full" data-act="clearDone">Limpar concluídas</button>';
  return h;
}
function viewAgenda(){
  var t = ymd(), fut = S.events.filter(function(e){return e.date>=t;}).sort(sortEvents), past = S.events.filter(function(e){return e.date<t;}).sort(sortEvents).reverse();
  var h = '<h1>Agenda</h1><p class="sub">Médico, provas, consultas e outros compromissos.</p><button class="full primary" data-act="newEvent">+ Novo compromisso</button><h2>Próximos</h2>';
  h += fut.length ? fut.map(eventCard).join('') : '<div class="empty">Nenhum compromisso marcado.</div>';
  if(past.length) h += '<h2>Passados</h2>' + past.slice(0,10).map(eventCard).join('');
  return h;
}
function viewAjustes(){
  return '<h1>Ajustes</h1>' +
    '<div class="card"><div class="title">💾 Backup</div><p class="meta">Os dados ficam salvos só neste navegador. Se limpar o histórico ou trocar de celular, eles se perdem. Exporte um backup de vez em quando (ex.: toda semana) e guarde o arquivo.</p>' +
    '<div class="actions"><button class="primary" data-act="export">Exportar backup</button><button data-act="import">Importar backup</button></div></div>' +
    '<div class="card"><div class="title">📊 Resumo</div><p class="meta">'+S.habits.length+' hábitos · '+S.tasks.filter(function(x){return !x.done;}).length+' tarefas pendentes · '+S.events.length+' compromissos · '+Object.keys(S.logs).length+' dias com registro</p>' +
    (storageOk?'':'<p class="meta" style="color:var(--danger)">⚠️ O navegador não está salvando os dados. Use Exportar backup.</p>') + '</div>' +
    '<div class="card"><div class="title">Apagar tudo</div><p class="meta">Volta o app ao início (hábitos padrão, sem tarefas nem compromissos).</p><button class="danger" data-act="reset">Apagar todos os dados</button></div>';
}

function render(){
  var v = {hoje:viewHoje, habitos:viewHabitos, tarefas:viewTarefas, agenda:viewAgenda, ajustes:viewAjustes}[tab];
  app.innerHTML = v();
  Array.prototype.forEach.call(document.querySelectorAll("nav button"), function(b){ b.classList.toggle("act", b.dataset.tab===tab); });
}

// ---------- sheets (formulários) ----------
var bg = document.getElementById("sheetBg"), sheet = document.getElementById("sheet");
function openSheet(html, onSubmit){
  sheet.innerHTML = '<form id="f">'+html+'</form>'; bg.classList.add("open");
  var f = document.getElementById("f");
  f.onsubmit = function(ev){ ev.preventDefault(); if(onSubmit(f) !== false) closeSheet(); };
  var first = f.querySelector("input[autofocus]"); if(first) setTimeout(function(){first.focus();},50);
}
function closeSheet(){ bg.classList.remove("open"); sheet.innerHTML = ""; }
bg.addEventListener("click", function(e){ if(e.target===bg) closeSheet(); });
var formBtns = '<div class="actions"><button type="button" class="ghost" data-act="close">Cancelar</button><button type="submit" class="primary">Salvar</button></div>';

function taskForm(pre){
  pre = pre || {};
  openSheet('<h3>Nova tarefa</h3><label>O que fazer</label><input name="title" required autofocus value="'+esc(pre.title||"")+'" placeholder="Ex.: Lavar roupa">' +
    '<div class="two"><div><label>Data (opcional)</label><input type="date" name="date" value="'+(pre.date||"")+'"></div>' +
    '<div><label>Categoria</label><select name="cat">'+CATS.map(function(c){return '<option'+(c===(pre.cat||"Pessoal")?' selected':'')+'>'+c+'</option>';}).join('')+'</select></div></div>' +
    '<label class="inline"><input type="checkbox" name="repeat"'+(pre.repeat?' checked':'')+'> Repetir toda semana</label>' + formBtns,
  function(f){ addTask({title:f.title.value.trim(), date:f.date.value, cat:f.cat.value, repeat:f.repeat.checked}); toast("Tarefa adicionada"); render(); });
}
function eventForm(id){
  var e = S.events.filter(function(x){return x.id===id;})[0] || {date:ymd()};
  openSheet('<h3>'+(id?'Editar':'Novo')+' compromisso</h3><label>O quê</label><input name="title" required autofocus value="'+esc(e.title||"")+'" placeholder="Ex.: Consulta no médico">' +
    '<div class="two"><div><label>Data</label><input type="date" name="date" required value="'+(e.date||"")+'"></div><div><label>Hora</label><input type="time" name="time" value="'+(e.time||"")+'"></div></div>' +
    '<label>Local (opcional)</label><input name="place" value="'+esc(e.place||"")+'" placeholder="Ex.: UBS do bairro">' + formBtns,
  function(f){
    var o = {title:f.title.value.trim(), date:f.date.value, time:f.time.value, place:f.place.value.trim()};
    if(id){ Object.assign(e,o); } else { o.id = uid(); S.events.push(o); }
    save(); toast("Compromisso salvo"); render();
  });
}
function habitForm(id){
  var h = habit(id) || {icon:"⭐", goal:15};
  openSheet('<h3>'+(id?'Editar':'Novo')+' hábito</h3><div class="two" style="grid-template-columns:80px 1fr"><div><label>Ícone</label><input name="icon" maxlength="4" value="'+esc(h.icon||"")+'"></div>' +
    '<div><label>Nome</label><input name="name" required autofocus value="'+esc(h.name||"")+'" placeholder="Ex.: Caminhada"></div></div>' +
    '<label>Meta diária (minutos, 0 = só marcar feito)</label><input type="number" name="goal" min="0" max="600" inputmode="numeric" value="'+(h.goal||0)+'">' + formBtns +
    (id?'<button type="button" class="danger full" style="margin-top:10px" data-act="delHabit" data-id="'+id+'">Remover hábito</button>':''),
  function(f){
    var o = {name:f.name.value.trim(), icon:f.icon.value.trim(), goal:Math.max(0, parseInt(f.goal.value,10)||0)};
    if(id){ Object.assign(h,o); } else { o.id = uid(); S.habits.push(o); }
    save(); render();
  });
}
function minForm(id){
  var h = habit(id);
  openSheet('<h3>'+esc(h.icon)+' '+esc(h.name)+'</h3><p class="meta">Hoje: '+fmtMin(liveMin(id))+(h.goal?' de '+fmtMin(h.goal):'')+'</p>' +
    '<div class="actions">'+[5,10,20,30].map(function(n){return '<button type="button" data-act="plus" data-id="'+id+'" data-n="'+n+'">+'+n+'</button>';}).join('')+'</div>' +
    '<label>Ou digite os minutos de hoje (total)</label><input type="number" name="min" min="0" max="1440" inputmode="numeric" value="'+Math.round(getLog(ymd(),id).min||0)+'">' + formBtns,
  function(f){ var l = getLog(ymd(),id); l.min = Math.max(0, parseFloat(f.min.value)||0); if(h.goal && l.min < h.goal) l.done = false; setLog(ymd(),id,l); save(); render(); });
}

// ---------- backup ----------
function doExport(){
  if(S.timer) stopTimer(true);
  var blob = new Blob([JSON.stringify(S,null,2)], {type:"application/json"});
  var a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "rotina-backup-"+ymd()+".json";
  document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  toast("Backup gerado"); render();
}
document.getElementById("importFile").addEventListener("change", function(){
  var file = this.files[0]; if(!file) return; var r = new FileReader();
  r.onload = function(){
    try{ var d = JSON.parse(r.result); if(!d || !Array.isArray(d.habits)) throw 0;
      if(!confirm("Substituir os dados atuais pelos do backup?")) return;
      S = d; load.fix(); save(); toast("Backup importado ✔"); render();
    }catch(e){ alert("Arquivo inválido. Escolha um backup exportado por este app."); }
  };
  r.readAsText(file); this.value = "";
});
load.fix = function(){ var d = defaults(); ["habits","tasks","events"].forEach(function(k){ if(!Array.isArray(S[k])) S[k] = d[k]; }); if(!S.logs||typeof S.logs!=="object") S.logs = {}; };

// ---------- eventos ----------
document.addEventListener("click", function(e){
  var b = e.target.closest("[data-act],[data-tab]"); if(!b) return;
  if(b.dataset.tab){ tab = b.dataset.tab; closeSheet(); render(); window.scrollTo(0,0); return; }
  var id = b.dataset.id;
  switch(b.dataset.act){
    case "toggleHabit": toggleDone(id); break;
    case "startTimer": startTimer(id); break;
    case "stopTimer": stopTimer(); break;
    case "addMin": minForm(id); break;
    case "plus": var l = getLog(ymd(),id); l.min = (l.min||0) + (+b.dataset.n); setLog(ymd(),id,l); save(); closeSheet(); toast("+"+b.dataset.n+" min"); render(); break;
    case "editHabit": habitForm(id); break;
    case "newHabit": habitForm(null); break;
    case "delHabit": if(confirm("Remover este hábito? O histórico dele some.")){ S.habits = S.habits.filter(function(h){return h.id!==id;}); if(S.timer&&S.timer.hid===id) S.timer=null; save(); closeSheet(); render(); } break;
    case "newTask": taskForm(taskFilter!=="Todas"?{cat:taskFilter}:null); break;
    case "quick": taskForm({title:b.dataset.title, cat:"Casa", date:ymd(), repeat:true}); break;
    case "toggleTask": completeTask(id); break;
    case "delTask": if(confirm("Apagar esta tarefa?")){ S.tasks = S.tasks.filter(function(t){return t.id!==id;}); save(); render(); } break;
    case "filter": taskFilter = b.dataset.cat; render(); break;
    case "clearDone": S.tasks = S.tasks.filter(function(t){return !t.done;}); save(); render(); break;
    case "newEvent": eventForm(null); break;
    case "editEvent": eventForm(id); break;
    case "delEvent": if(confirm("Apagar este compromisso?")){ S.events = S.events.filter(function(x){return x.id!==id;}); save(); render(); } break;
    case "export": doExport(); break;
    case "import": document.getElementById("importFile").click(); break;
    case "reset": if(confirm("Tem certeza? Isso apaga tudo. Faça um backup antes.")){ S = defaults(); save(); render(); } break;
    case "close": closeSheet(); break;
  }
});

// timer ao vivo + virada do dia
var lastDay = ymd();
setInterval(function(){
  if(S.timer){ var els = document.querySelectorAll("[data-timer]"); for(var i=0;i<els.length;i++) els[i].textContent = timerText(); }
  if(ymd() !== lastDay){ lastDay = ymd(); if(!bg.classList.contains("open")) render(); }
}, 1000);
setInterval(function(){ if(S.timer && !bg.classList.contains("open")) render(); }, 30000);
document.addEventListener("visibilitychange", function(){ if(!document.hidden && !bg.classList.contains("open")) render(); });

load(); save(); render();
window.__rotina = {state:function(){return S;}, ymd:ymd, addDays:addDays, streak:streak, status:status};
})();
</script>
</body>
